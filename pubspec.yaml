name: bazaar_pos
description: An offline, multilingual supermarket point of sale for mobile and desktop.
publish_to: none
version: 1.1.1+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  sqlite3: ^3.5.2
  path_provider: ^2.1.5
  cryptography: ^2.9.0
  file_picker: ^10.3.10
  pdf: ^3.11.3
  printing: ^5.14.2
  cupertino_icons: ^1.0.9
  http: ^1.6.0
  # Keep compatible with file_picker 10's win32 dependency.
  package_info_plus: ^9.0.1
  pub_semver: ^2.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fonts/
    - assets/products/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
